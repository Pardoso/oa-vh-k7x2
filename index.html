<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f6f43">
  <title>Órdenes de aplicación</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Órdenes de aplicación</h1>
      <span class="top-der"><span id="estado" class="pill" title="">Cargando…</span><button id="btn-salir" class="pill salir" hidden>Salir</button></span>
    </div>
    <div class="buscar">
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="Buscar: número, producto, especie, cuartel…" aria-label="Buscar órdenes">
    </div>
    <div class="filtros">
      <select id="f-cuando" aria-label="Fecha">
        <option value="">Todas las fechas</option>
        <option value="sin">Sin fecha (por asignar)</option>
        <option value="hoy">Hoy</option>
        <option value="prox">Próximas (desde hoy)</option>
        <option value="sem">Esta semana</option>
        <option value="pas">Ya pasadas</option>
      </select>
      <select id="f-grupo" aria-label="Especie"><option value="">Toda especie</option></select>
      <select id="f-tipo" aria-label="Tipo"><option value="">Todo tipo</option></select>
      <select id="f-orden" aria-label="Ordenar">
        <option value="fecha">Orden: fecha de aplicación</option>
        <option value="numero">Orden: número</option>
        <option value="creado">Orden: recién cargadas</option>
      </select>
    </div>
  </header>

  <main>
    <p id="resumen" class="resumen" aria-live="polite"></p>
    <div id="aviso" class="aviso" hidden></div>

    <table id="tabla" class="tabla">
      <thead>
        <tr>
          <th>N° orden</th><th>Fecha aplicación</th><th>Especie</th><th>Tipo</th>
          <th>Productos</th><th>Cuarteles</th><th class="num">ha</th>
        </tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>
    <div id="tarjetas" class="tarjetas"></div>

    <div class="mas">
      <button id="btn-historial" class="btn" hidden>Cargar órdenes más antiguas</button>
    </div>
  </main>

  <dialog id="detalle" aria-labelledby="d-titulo">
    <div id="detalle-contenido"></div>
  </dialog>

  <div id="login" class="login" hidden>
    <form id="login-form" class="login-panel" autocomplete="on">
      <h2>Órdenes de aplicación</h2>
      <p>Escribe la clave de acceso.</p>
      <input type="email" name="username" autocomplete="username" value="acceso" hidden readonly>
      <input id="login-clave" name="password" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave de acceso" required>
      <label class="ver"><input id="login-ver" type="checkbox"> Mostrar clave</label>
      <button id="login-entrar" class="btn pri" type="submit">Entrar</button>
      <p id="login-error" class="login-error" role="alert"></p>
      <p class="sub">Solo la primera vez en cada dispositivo. Después queda guardada.</p>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
